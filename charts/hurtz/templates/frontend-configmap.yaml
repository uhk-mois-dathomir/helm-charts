{{- $fullname := include "hurtz.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "hurtz.labels" . | nindent 4 }}
data:
  # Replaces the image's default.conf: Pangolin targets a single Service, so nginx also
  # routes backend paths. X-Forwarded-* from Pangolin pass through unchanged so the backend
  # (trust proxy = 1 hop) still reads the real client IP and https scheme.
  default.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;

        location /api/ {
            proxy_pass http://{{ $fullname }}-backend:3000;
        }

        location /oauth/ {
            proxy_pass http://{{ $fullname }}-backend:3000;
        }

        location /.well-known/ {
            proxy_pass http://{{ $fullname }}-backend:3000;
        }

        # Streamable HTTP MCP may answer with SSE streams.
        location = /mcp {
            proxy_pass http://{{ $fullname }}-backend:3000;
            proxy_buffering off;
            proxy_read_timeout 1h;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri /index.html;
        }
    }
