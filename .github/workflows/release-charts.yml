name: Release Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/release-charts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package charts
        run: |
          mkdir -p .chart-packages
          if compgen -G "charts/*/Chart.yaml" > /dev/null; then
            for chart in charts/*; do
              [ -f "${chart}/Chart.yaml" ] || continue
              helm dependency build "${chart}"
              helm package "${chart}" --destination .chart-packages
            done
          else
            echo "No charts found under charts/*"
          fi

      - name: Build repository index
        run: |
          mkdir -p .chart-repo
          cp -f .chart-packages/*.tgz .chart-repo 2>/dev/null || true
          helm repo index .chart-repo --url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

      - name: Add GitHub Pages landing page
        run: |
          cat > .chart-repo/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Helm Chart Repository</title>
            </head>
            <body>
              <h1>Helm Chart Repository</h1>
              <p>This GitHub Pages site hosts the Helm chart repository index.</p>
              <p><a href="./index.yaml">Open index.yaml</a></p>
            </body>
          </html>
          EOF
          touch .chart-repo/.nojekyll

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .chart-repo
          force_orphan: true
